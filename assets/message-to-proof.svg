<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="210" viewBox="0 0 1040 210" role="img" aria-labelledby="title desc">
<title id="title">Messaging to proof framework</title><desc id="desc">Three connected stages: define the buyer, state the workflow value, and show verifiable proof.</desc>
<defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#8ab7ff"/></linearGradient></defs>
<rect x="1" y="1" width="1038" height="208" rx="20" fill="#f9fcfd" stroke="#e2e9ef"/>
<path d="M315 103 H365 M675 103 H725" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
<path d="M355 93 L365 103 L355 113 M715 93 L725 103 L715 113" stroke="#36bcb0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g font-family="Inter, Arial, sans-serif">
<rect x="28" y="30" width="287" height="150" rx="14" fill="#edf5fc" stroke="#d5e4f2"/><circle cx="58" cy="60" r="15" fill="#d2e9ff"/><text x="58" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#275b8d">1</text><text x="84" y="65" font-size="12" font-weight="800" letter-spacing="1.2" fill="#64809b">BUYER</text><text x="49" y="101" font-size="20" font-weight="750" fill="#132d43">Who is it for?</text><text x="49" y="126" font-size="12" fill="#61768a">Name the team, desk type</text><text x="49" y="144" font-size="12" fill="#61768a">and buying context.</text>
<rect x="377" y="30" width="298" height="150" rx="14" fill="#e9faf7" stroke="#ccefe8"/><circle cx="407" cy="60" r="15" fill="#c5f4e9"/><text x="407" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#11776d">2</text><text x="433" y="65" font-size="12" font-weight="800" letter-spacing="1.2" fill="#4e8b85">VALUE</text><text x="398" y="101" font-size="20" font-weight="750" fill="#113c3b">What gets easier?</text><text x="398" y="126" font-size="12" fill="#5b7f7d">Describe the workflow result</text><text x="398" y="144" font-size="12" fill="#5b7f7d">before listing features.</text>
<rect x="737" y="30" width="275" height="150" rx="14" fill="#fff6e9" stroke="#f4e2c5"/><circle cx="767" cy="60" r="15" fill="#ffe4b3"/><text x="767" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#9a5d12">3</text><text x="793" y="65" font-size="12" font-weight="800" letter-spacing="1.2" fill="#a47a40">PROOF</text><text x="758" y="101" font-size="20" font-weight="750" fill="#573e1e">Why believe it?</text><text x="758" y="126" font-size="12" fill="#887456">Show a verifiable workflow,</text><text x="758" y="144" font-size="12" fill="#887456">customer outcome or evidence.</text>
</g></svg>