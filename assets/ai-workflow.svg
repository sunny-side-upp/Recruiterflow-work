<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AI-assisted marketing workflow with human validation</title>
  <desc id="desc">A five-step process: source-grounded brief, AI synthesis, human verification, approved asset, and measurement loop.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071827"/><stop offset="1" stop-color="#12384b"/></linearGradient></defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <text x="48" y="49" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#82d9cf">A HUMAN-LED, AI-ASSISTED LOOP</text>
  <text x="48" y="80" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ffffff">Accelerate the draft. Keep the evidence in control.</text>
  <g font-family="Arial,sans-serif">
    <g><rect x="44" y="127" width="194" height="136" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#70c9c7" stroke-opacity=".7"/><text x="64" y="157" font-size="12" font-weight="700" letter-spacing="1.6" fill="#83d8d0">01 · INPUT</text><text x="64" y="191" font-size="18" font-weight="700" fill="#ffffff">Grounded brief</text><text x="64" y="218" font-size="12" fill="#c7d6df">Approved facts, audience,</text><text x="64" y="237" font-size="12" fill="#c7d6df">constraints and sources</text></g>
    <path d="M242 195 H269" stroke="#70c9c7" stroke-width="2.3"/><path d="M263 189 L270 195 L263 201" fill="none" stroke="#70c9c7" stroke-width="2.3"/>
    <g><rect x="278" y="127" width="194" height="136" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#70c9c7" stroke-opacity=".7"/><text x="298" y="157" font-size="12" font-weight="700" letter-spacing="1.6" fill="#83d8d0">02 · AI</text><text x="298" y="191" font-size="18" font-weight="700" fill="#ffffff">Synthesis &amp; drafts</text><text x="298" y="218" font-size="12" fill="#c7d6df">Themes, variants, structure,</text><text x="298" y="237" font-size="12" fill="#c7d6df">and gaps to verify</text></g>
    <path d="M476 195 H503" stroke="#70c9c7" stroke-width="2.3"/><path d="M497 189 L504 195 L497 201" fill="none" stroke="#70c9c7" stroke-width="2.3"/>
    <g><rect x="512" y="127" width="194" height="136" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#f7c77b" stroke-opacity=".9"/><text x="532" y="157" font-size="12" font-weight="700" letter-spacing="1.6" fill="#f7c77b">03 · HUMAN</text><text x="532" y="191" font-size="18" font-weight="700" fill="#ffffff">Fact-check &amp; review</text><text x="532" y="218" font-size="12" fill="#c7d6df">Source, SME, compliance</text><text x="532" y="237" font-size="12" fill="#c7d6df">and customer approval</text></g>
    <path d="M710 195 H737" stroke="#70c9c7" stroke-width="2.3"/><path d="M731 189 L738 195 L731 201" fill="none" stroke="#70c9c7" stroke-width="2.3"/>
    <g><rect x="746" y="127" width="194" height="136" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#70c9c7" stroke-opacity=".7"/><text x="766" y="157" font-size="12" font-weight="700" letter-spacing="1.6" fill="#83d8d0">04 · ASSET</text><text x="766" y="191" font-size="18" font-weight="700" fill="#ffffff">Approved content</text><text x="766" y="218" font-size="12" fill="#c7d6df">Battlecard, email, page,</text><text x="766" y="237" font-size="12" fill="#c7d6df">push or story</text></g>
    <path d="M944 195 H971" stroke="#70c9c7" stroke-width="2.3"/><path d="M965 189 L972 195 L965 201" fill="none" stroke="#70c9c7" stroke-width="2.3"/>
    <g><rect x="980" y="127" width="176" height="136" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#70c9c7" stroke-opacity=".7"/><text x="1000" y="157" font-size="12" font-weight="700" letter-spacing="1.6" fill="#83d8d0">05 · LEARN</text><text x="1000" y="191" font-size="18" font-weight="700" fill="#ffffff">Measure &amp; iterate</text><text x="1000" y="218" font-size="12" fill="#c7d6df">Quality, engagement,</text><text x="1000" y="237" font-size="12" fill="#c7d6df">conversion and risk</text></g>
    <path d="M1065 270 C1065 313 141 313 141 270" fill="none" stroke="#70c9c7" stroke-width="1.6" stroke-dasharray="5 6"/><path d="M135 278 L141 269 L147 278" fill="none" stroke="#70c9c7" stroke-width="1.6"/>
    <text x="600" y="327" text-anchor="middle" font-size="12" fill="#9fb8c8">AI accelerates the first draft; evidence and people control the final claim.</text>
  </g>
</svg>